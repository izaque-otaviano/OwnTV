# Personalização: builds the custom APK and publishes it as the fork's latest GitHub Release, so it
# has a fixed public link (…/releases/latest/download/OwnTV.apk) for the Downloader app.
# Signed with the fork's own key when the KEYSTORE_* secrets are set (updates then install over each
# other); otherwise debug-signed, and every new build needs the previous one uninstalled first.
name: Custom release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_NAME="5.2.0-custom.${GITHUB_RUN_NUMBER}"
          export VERSION_CODE=$((50200 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          mkdir -p dist
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            ./gradlew assembleStandardRelease --stacktrace
            cp "$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)" dist/OwnTV.apk
          else
            ./gradlew assembleStandardDebug --stacktrace
            cp "$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)" dist/OwnTV.apk
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: custom-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OwnTV personalizado ${{ github.run_number }}
          body: "Build da branch ${{ github.ref_name }} (${{ github.sha }})."
          files: dist/OwnTV.apk
          make_latest: true
