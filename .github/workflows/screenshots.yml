# Personalização: renders the custom look's components to PNG (CustomLookScreenshotTest) and
# publishes them to the `screenshots` branch, so the look can be reviewed without a TV.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Render screenshots
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest -Powntv.screenshots=true --tests 'tv.own.owntv.screenshots.*' --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Publish to the screenshots branch
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          cp app/build/screenshots/*.png "$RUNNER_TEMP/shots/"
          cd "$RUNNER_TEMP/shots"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots of ${SRC_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots
